services:
  postgres:
    image: postgres:16
    container_name: project03-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: ${PROJECT03_PG_PASSWORD:?Password required}
      POSTGRES_DB: project03_nyc311
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - project03_data:/var/lib/postgresql/data

volumes:
  project03_data:
